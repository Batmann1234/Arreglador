    tiene-runas: "<#52FF7A>Tu ítem tiene runas. Sácalas en el rompedor: recibirás tu ítem actualizado y tus runas."
    cooldown: "<red>Espera un momento."
    listo: "<#52FF7A>Ítem arreglado: recibiste su versión nueva."
