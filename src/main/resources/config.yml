# =====================================================================
#  /arreglar : cambia un ítem SIN runas por su versión nueva.
#              Si tiene runas, abre el rompedor.
# =====================================================================
arreglar:
  menu:
    titulo: "<gradient:#00FF3B:#52FF7A>Arreglar Ítems</gradient>"
    filas: 3
    relleno: BLACK_STAINED_GLASS_PANE
    info:
      slot: 13
      material: ANVIL
      nombre: "<#52FF7A><bold>Cómo arreglar tu ítem"
      lore:
        - "<white>Haz <#52FF7A>shift + click derecho <white>a tu ítem"
        - "<white>en tu inventario para cambiarlo por"
        - "<white>su versión nueva."
        - ""
        - "<red>Si tiene runas, se abrirá el rompedor"
        - "<red>para sacárselas primero."

  comandos:
    # Placeholders: <jugador> <item>
    item-nuevo: "mm i give -s <jugador> <item>"

  # Solo estos ítems se pueden arreglar.
  # Formato:  ID_del_ítem_que_entrega_el_jugador: "ID_del_ítem_nuevo_que_recibe"
  # Si el ID nuevo es el mismo, recibe la versión actual de ese mismo ítem.
  items:
    GuadañaDeVerdugo1: "GuadañaDeVerdugo1"
    GuadañaDeVerdugo2: "GuadañaDeVerdugo2"
    GuadañaDeVerdugo3: "GuadañaDeVerdugo3"
    ArcoDeElfo3: "ArcoDeElfo3"
    DagaDelAsesino1: "DagaDelAsesino1"
    DagaDelAsesino2: "DagaDelAsesino2"
    DagaRapida: "DagaRapida"
    EspadaBerserker1: "EspadaBerserker1"
    EspadaBerserker2: "EspadaBerserker2"
    EspadaBerserker3: "EspadaBerserker3"
    EspadaDelCaballero1: "EspadaDelCaballero1"
    EspadaDelCaballero2: "EspadaDelCaballero2"
    EspadaSaltarina: "EspadaSaltarina"
    EspadaSaltarina2: "EspadaSaltarina2"
    EspadaGuerrero1: "EspadaGuerrero1"
    EspadaGuerrero2: "EspadaGuerrero2"
    EspadaSaltarina3: "EspadaSaltarina3"
    DagaDePascua: "DagaDePascua"
    GuillotinaDelVerdugo: "GuillotinaDelVerdugo"
    Resistencia4: "Resistencia4"
    CarameloResistencia: "CarameloResistencia"
    CarameloRegeneracion: "CarameloRegeneracion"
    CarameloFuerza: "CarameloFuerza"
    CarameloVelocidad: "CarameloVelocidad"

  cooldown-ms: 100

# =====================================================================
#  /rompedor (alias /romper) : destruye el ítem y devuelve su versión
#  limpia + todas sus runas de AdvancedEnchantments.
# =====================================================================
rompedor:
  menu:
    titulo: "<gradient:#00FF3B:#52FF7A>Rompedor de Encantamientos</gradient>"
    filas: 3
    slot-item: 13
    relleno: BLACK_STAINED_GLASS_PANE
    info:
      slot: 22
      material: PAPER
      nombre: "<#52FF7A><bold>SHIFT + CLICK DERECHO A TU ITEM"
      lore:
        - "<white>Se destruirá el ítem y recibirás"
        - "<white>su versión limpia + todas sus runas."

  comandos:
    # Placeholders: <jugador> <item>
    item-limpio: "mm i give -s <jugador> <item>"
    # Placeholders: <jugador> <encantamiento> <nivel>
    runa: "ae givebook <jugador> <encantamiento> <nivel> 1 70 0"

  # Vacío = cualquier ítem de MythicMobs. Con IDs, solo esos se pueden romper.
  items-permitidos:
    - "GuadañaDeVerdugo1"
    - "GuadañaDeVerdugo2"
    - "GuadañaDeVerdugo3"
    - "ArcoDeElfo3"
    - "DagaDelAsesino1"
    - "DagaDelAsesino2"
    - "EspadaBerserker1"
    - "EspadaBerserker2"
    - "EspadaBerserker3"
    - "EspadaDelCaballero1"
    - "EspadaDelCaballero2"
    - "EspadaSaltarina"
    - "EspadaSaltarina2"
    - "EspadaSaltarina3"
    - "DagaDePascua"
    - "DagaRapida"
    - "GuillotinaDelVerdugo"

  cooldown-ms: 500

# =====================================================================
#  Mensajes (cada menú con su prefijo). <codigo> en "error" = código de fallo.
# =====================================================================
mensajes:
  arreglar:
